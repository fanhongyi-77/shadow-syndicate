[project]
name = "void-echo-test-mcp"
version = "0.3.0"
description = "VOID ECHO Phase 0.3 - one local MCP Echo Server verified against DSH and OpenAI clients"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
void-echo-mcp = "void_echo_test.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/void_echo_test"]
